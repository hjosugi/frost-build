# Real C demo workspace for the Rust `frost` binary.
# Build it with:  frost -C sample_c build

[workspace]
default_targets = ["app"]

[toolchain]
# The C driver is left to the host default (`cc`, or `gcc` where that name
# does not exist) so this workspace builds anywhere frost is published.
cflags = ["-O2", "-Wall"]

[target.app]
kind = "cc_binary"
srcs = ["src/main.c"]
deps = ["util", "gen_config"]

[target.gen_config]
kind = "genrule"
inputs = ["tools/gen_config", "tools/gen_config.cmd"]
# The host separator plus extension-neutral name resolves to tools/gen_config
# on POSIX and tools\gen_config.cmd through PATHEXT on Windows.
cmd = "tools${pathsep}gen_config ${out}"
includes = ["gen"]
outputs = ["gen/config.h"]

[target.util]
kind = "cc_library"
srcs = ["src/util.c"]
includes = ["include"]
