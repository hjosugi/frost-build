[workspace]
members = [
    "crates/frostbuild-core",
    "crates/frostbuild-exec",
    "crates/frostbuild-cli",
    "crates/frostbuild-store",
    "crates/frostbuild-daemon",
    "crates/frostbuild-bench",
]
resolver = "2"

[workspace.package]
version = "0.13.1"
edition = "2021"
license = "0BSD"
repository = "https://github.com/hjosugi/frost-build"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = { version = "1", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
# `frost fmt` rewrites a manifest and gives the comments back. Every crate this
# pulls in is already here through `toml` and `serde`; it is the one addition.
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
tar = { version = "0.4", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6"
clap_mangen = "0.3"
crossterm = "0.29"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
glob = "0.3"
memmap2 = "0.9"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rayon = "1"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
notify = "8"
quick-xml = { version = "0.41", features = ["serialize"] }
self-replace = "1.5"
ignore = "0.4"
proptest = "1"
frostbuild-core = { version = "0.13.1", path = "crates/frostbuild-core" }
frostbuild-exec = { version = "0.13.1", path = "crates/frostbuild-exec" }
frostbuild-store = { version = "0.13.1", path = "crates/frostbuild-store" }
frostbuild-daemon = { version = "0.13.1", path = "crates/frostbuild-daemon" }
frostbuild-bench = { version = "0.13.1", path = "crates/frostbuild-bench" }

[profile.release]
lto = "thin"
