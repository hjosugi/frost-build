# One javac batch and one deterministic jar. `command` rather than a native
# rule because javac has a real argv interface: Frost passes it directly, with
# no shell to quote for, and fingerprints the compiler as a toolchain input.

[target.greeting]
kind = "command"
tool = "javac"
inputs = ["src/main/java/com/example/greeting/Greeting.java"]
# Every command output must contain ${config}, which keeps debug, release and
# cross-platform trees from colliding. Paths are package-relative, so this
# resolves under greeting/.
outputs = [".frost/out/${config}/greeting.jar"]
# Removed and recreated before every run, so a class deleted from the sources
# cannot survive in the jar.
clean_dirs = [".frost/tmp/${config}/greeting-classes"]
args = ["-d", "${clean_dir}", "${in}"]
steps = [
  { tool = "pack_jar", args = ["pack-jar", "--input", "${clean_dir}",
                               "--output", "${out}"] },
]
# On macOS `javac` is a stub that picks a JDK from JAVA_HOME, so a build that
# cleared it would compile against a different JDK than the one that runs the
# result. Its present-or-absent value is action-key material.
pass_env = ["JAVA_HOME"]
# javac reads a JDK installation that lives outside the workspace.
sandbox = false
