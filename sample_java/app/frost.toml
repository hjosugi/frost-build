# The application module. Note what is *not* here: greeting's output path.
#
# `deps` names the target, and `${deps}` expands to that target's declared
# outputs, so where greeting writes its jar stays greeting's business. Writing
# `../greeting/.frost/out/${config}/greeting.jar` by hand would work today and
# break the moment the layout convention changes.
#
# One dependency means `${deps}` is one argv item, which is what `-cp` wants.
# Joining several dependency outputs into a single path-separated argument is
# the gap tracked in issue #158; until then, a module that needs two jars on
# one classpath states them itself.

[target.app]
kind = "command"
tool = "javac"
deps = ["//greeting:greeting"]
inputs = ["src/main/java/com/example/app/App.java"]
outputs = [".frost/out/${config}/app.jar"]
clean_dirs = [".frost/tmp/${config}/app-classes"]
args = ["-cp", "${deps}", "-d", "${clean_dir}", "${in}"]
steps = [
  { tool = "pack_jar", args = ["pack-jar", "--input", "${clean_dir}",
                               "--output", "${out}",
                               "--main-class", "com.example.app.App"] },
]
pass_env = ["JAVA_HOME"]
sandbox = false
