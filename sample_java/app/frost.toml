# The application module. Note what is *not* here: greeting's output path.
#
# `${dep:LABEL}` resolves to the single declared output of a target this one
# declared a dependency on, so where greeting writes its jar stays greeting's
# business. Writing `../greeting/.frost/out/${config}/greeting.jar` by hand
# would work today and break the moment the layout convention changes.
#
# The expansion lands in argv, and argv is action-key material, so moving that
# jar rebuilds this module rather than replaying a command that names a path
# which no longer exists.
#
# `${deps}` (every dependency's outputs) and `${deps:LABEL}` (one dependency's
# outputs) are the plural forms; both must occupy a whole argument, so neither
# builds a path-separated classpath. A module needing two jars on one `-cp`
# still writes that argument itself.

[target.app]
kind = "command"
tool = "javac"
deps = ["//greeting:greeting"]
inputs = ["src/main/java/com/example/app/App.java"]
outputs = [".frost/out/${config}/app.jar"]
clean_dirs = [".frost/tmp/${config}/app-classes"]
args = ["-cp", "${dep://greeting:greeting}", "-d", "${clean_dir}", "${in}"]
steps = [
  { tool = "pack_jar", args = ["pack-jar", "--input", "${clean_dir}",
                               "--output", "${out}",
                               "--main-class", "com.example.app.App"] },
]
pass_env = ["JAVA_HOME"]
sandbox = false
