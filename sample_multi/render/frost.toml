# The other middle of the diamond. Also depends on //core:core only, which is
# what gives //apps/cli:cli two distinct paths down to it.

[target.render]
kind = "cc_library"
srcs = ["src/render.c"]
deps = ["//core:core"]
# The other route from //apps/cli to //core.
visibility = ["//apps/..."]
includes = ["include"]
