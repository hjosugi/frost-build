[package]
name = "frostbuild-reapi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "REAPI v2 (gRPC/protobuf) client for the FrostBuild remote cache and executor"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
bytes = "1"
prost = "0.14"
prost-types = "0.14"
sha2.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
