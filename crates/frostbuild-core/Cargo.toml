[package]
name = "frostbuild-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core graph, manifest, hashing, journal, and CAS types for FrostBuild"

[lib]
path = "src/lib.rs"

[features]
default = ["reapi", "http-tls"]
# The REAPI v2 gRPC client. It carries a large protocol stack (tonic, tokio,
# rustls), so it can be dropped entirely with `--no-default-features`; the
# `grpc://` / `grpcs://` backends then refuse the endpoint with a message that
# names the feature rather than failing obscurely.
reapi = ["dep:frostbuild-reapi"]
# TLS for the plain HTTP remote cache (`https://`). The HTTP backend is written
# directly on TCP to keep its dependency footprint small, so TLS is its own
# feature; without it an `https://` endpoint is refused with a message naming
# the feature instead of silently downgrading to plaintext.
http-tls = ["dep:rustls", "dep:rustls-native-certs"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
frostbuild-reapi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
zstd.workspace = true
glob.workspace = true
memmap2.workspace = true
postcard.workspace = true
rayon.workspace = true
ignore.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
proptest.workspace = true
frostbuild-reapi.workspace = true
