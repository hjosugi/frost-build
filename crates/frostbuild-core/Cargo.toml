[package]
name = "frostbuild-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core graph, manifest, hashing, journal, and CAS types for FrostBuild"

[lib]
path = "src/lib.rs"

[features]
default = ["reapi"]
# The REAPI v2 gRPC client. It carries a large protocol stack (tonic, tokio,
# rustls), so it can be dropped entirely with `--no-default-features`; the
# `grpc://` / `grpcs://` backends then refuse the endpoint with a message that
# names the feature rather than failing obscurely.
reapi = ["dep:frostbuild-reapi"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
frostbuild-reapi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
zstd.workspace = true
glob.workspace = true
memmap2.workspace = true
postcard.workspace = true
rayon.workspace = true
ignore.workspace = true

[dev-dependencies]
proptest.workspace = true
frostbuild-reapi.workspace = true
