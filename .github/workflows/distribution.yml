name: Distribution smoke

on:
  schedule:
    - cron: "19 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: Latest release installs on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the expected latest stable version
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/hjosugi/frost-build/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_API_TOKEN']}",
                  "User-Agent": "frostbuild-distribution-ci",
              },
          )
          with urllib.request.urlopen(request) as response:
              release = json.load(response)
          print(f"EXPECTED_VERSION={release['tag_name'].removeprefix('v')}")
          PY
      - name: Install the latest release through the checked-in script
        shell: bash
        run: |
          sh install.sh --version "$EXPECTED_VERSION" --prefix "$RUNNER_TEMP/frost-prefix"
          test "$("$RUNNER_TEMP/frost-prefix/bin/frost" --version)" = "frost $EXPECTED_VERSION"
          test -x "$RUNNER_TEMP/frost-prefix/bin/frostd"
          test -f "$RUNNER_TEMP/frost-prefix/share/man/man1/frost.1"
      - name: Check for updates against the real release API
        shell: bash
        env:
          FROST_SELF_UPDATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/frost-prefix/bin/frost self-update --check"
      - name: Exercise verified replacement from the real release
        shell: bash
        env:
          # Force the installed latest binary through the download, checksum,
          # candidate smoke-test and atomic replacement path.
          FROST_SELF_UPDATE_CURRENT_VERSION: 0.0.0
          FROST_SELF_UPDATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/frost-prefix/bin/frost" self-update
          test "$("$RUNNER_TEMP/frost-prefix/bin/frost" --version)" = "frost $EXPECTED_VERSION"
      - name: Render the installed manual
        shell: bash
        run: MANPATH="$RUNNER_TEMP/frost-prefix/share/man" MANPAGER=cat man frost >/dev/null
      # The signing and provenance README.md tells users to check, checked
      # against the real release with exactly the published commands. Releases
      # before 0.14.0 predate signing and are reported, not failed.
      - name: Decide whether the release is signed
        shell: bash
        run: |
          signed="$(python3 -c 'import sys; print(tuple(map(int, sys.argv[1].split("."))) >= (0, 14, 0))' "$EXPECTED_VERSION")"
          echo "RELEASE_SIGNED=${signed}" >> "$GITHUB_ENV"
          if [ "$signed" != True ]; then
            echo "::notice::v${EXPECTED_VERSION} predates signed releases; signature checks skipped."
          fi
      - if: env.RELEASE_SIGNED == 'True'
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cosign@3.1.3
      - name: Verify every asset with the published procedure
        if: env.RELEASE_SIGNED == 'True' && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${EXPECTED_VERSION}" --repo hjosugi/frost-build --dir "$RUNNER_TEMP/release"
          scripts/verify_release.sh "$RUNNER_TEMP/release" "$EXPECTED_VERSION"
      - name: Install with signature and provenance verification
        if: env.RELEASE_SIGNED == 'True'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh install.sh --version "$EXPECTED_VERSION" --prefix "$RUNNER_TEMP/verified-prefix" \
            --verify-signature --verify-provenance
          test "$("$RUNNER_TEMP/verified-prefix/bin/frost" --version)" = "frost $EXPECTED_VERSION"
