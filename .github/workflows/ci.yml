name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Static site validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_site.py
      - run: node --check site/script.js

  cargo:
    name: Cargo build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push'
        run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check

  # Releases ship a macOS archive, so macOS runs the whole suite rather than one
  # smoke test. Exclusions are declared in the tests themselves (`cfg(unix)`,
  # `cfg(target_os = "linux")`, the bubblewrap early return) and tabulated in
  # docs/09_platform_support.md, so what does not run is visible in the code.
  macos:
    name: Host tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Releases ship a Windows archive, so Windows also runs every host-reachable
  # E2E. POSIX/signal and Linux-PTY cases declare their cfg gates in the test;
  # the sample itself has paired POSIX/cmd launchers and native output names use
  # the host executable suffix.
  windows:
    name: Host tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Put the image's MinGW toolchain on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\mingw64\bin"
      - name: Show the C toolchain the tests will use
        run: gcc --version && ar --version
      - run: cargo test --workspace --lib --bins --locked
      - name: Guard the Windows daemon against inherited-handle hangs
        timeout-minutes: 2
        run: cargo test -p frostbuild-cli --test e2e daemon_build_status_and_stop --locked -- --nocapture
      - run: cargo test -p frostbuild-cli --test e2e --locked -- --test-threads 1 --nocapture

  python:
    name: Python prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m py_compile frost.py tests/test_frost.py
      - run: python -m unittest discover -s tests
      - run: python frost.py build --workspace sample --jobs 4 --force
