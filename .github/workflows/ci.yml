name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: Cargo build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push'
        run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check

  # Releases ship a macOS archive, so macOS runs the whole suite rather than one
  # smoke test. Exclusions are declared in the tests themselves (`cfg(unix)`,
  # `cfg(target_os = "linux")`, the bubblewrap early return) and tabulated in
  # docs/09_platform_support.md, so what does not run is visible in the code.
  macos:
    name: Host tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Releases ship a Windows archive, so Windows also runs every host-reachable
  # E2E. POSIX/signal and Linux-PTY cases declare their cfg gates in the test;
  # the sample itself has paired POSIX/cmd launchers and native output names use
  # the host executable suffix.
  windows:
    name: Host tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Put the image's MinGW toolchain on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\mingw64\bin"
      - name: Show the C toolchain the tests will use
        run: gcc --version && ar --version
      - run: cargo test --workspace --lib --bins --locked
      - name: Guard the Windows daemon against inherited-handle hangs
        timeout-minutes: 2
        run: cargo test -p frostbuild-cli --test e2e daemon_build_status_and_stop --locked -- --nocapture
      - run: cargo test -p frostbuild-cli --test e2e --locked -- --test-threads 1 --nocapture

  # The last of #136's acceptance criteria is the one that cannot be met by a
  # test: that the JUnit conversion actually *appears* in CI. A unit test can
  # assert the XML is well formed; only a real run can show it rendered. So
  # this job builds a real workspace, converts the stream frost wrote, and
  # writes the result to the job summary — where it is visible without
  # downloading anything — as well as uploading the XML for anyone who wants to
  # feed it to a viewer.
  #
  # It is its own job rather than three more steps on `cargo` so that a failure
  # here names itself instead of being read as a broken test suite, and so the
  # gate is not made slower by a demonstration.
  junit:
    name: JUnit report from the event stream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p frostbuild-cli --locked
      - name: Build and test sample_multi, recording the event stream
        # --keep-going so a failure produces a report of everything else rather
        # than a report of the first thing that broke.
        run: |
          target/debug/frost -C sample_multi test --all --keep-going --no-tui \
            --build-event-json events.ndjson
      # Runs whether or not the build passed: a report of a failing build is
      # the case the report exists for. `always()` would also run it on a
      # cancelled job, which has nothing to report.
      - name: Convert the stream to JUnit XML
        if: success() || failure()
        run: |
          python3 scripts/frost_junit.py events.ndjson \
            --output junit.xml --summary "$GITHUB_STEP_SUMMARY"
      # A green report proves the pipeline; it does not show the case the
      # report exists for. So the same test is broken in a throwaway copy and
      # converted again, into the summary only — the uploaded artifact stays
      # the honest one. `|| true` because this build is *meant* to fail.
      - name: Show what a failing build's report looks like
        if: success() || failure()
        run: |
          cp -r sample_multi /tmp/broken
          rm -rf /tmp/broken/.frost
          sed -i 's/frost_core_add(40, 2) != 42/frost_core_add(40, 2) != 41/' \
            /tmp/broken/core/tests/core_test.c
          target/debug/frost -C /tmp/broken test --all --keep-going --no-tui \
            --build-event-json broken.ndjson || true
          python3 scripts/frost_junit.py broken.ndjson --output /dev/null \
            --suite-name "a deliberately broken build" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-xml
          path: |
            junit.xml
            events.ndjson

  python:
    name: Python prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m py_compile frost.py tests/test_frost.py
      # The brand PNGs are renderings of site/assets/frostbuild-mark.svg, and
      # `tests.test_site_mark` re-renders them to prove they still match. That
      # test skips without a renderer, and a skip here is the one place the
      # check is worth having: an edited SVG that was never rendered would
      # otherwise reach main with CI green and the site showing the old mark.
      - run: pip install cairosvg
      - run: python -m unittest discover -s tests
      - run: python frost.py build --workspace sample --jobs 4 --force

  # The extension's logic lives in modules that never import `vscode`, so its
  # tests are plain `node --test` and this job needs no VS Code download and no
  # display server. What that costs is that the thin VS Code layer is not
  # exercised here; what it buys is a test suite that runs in seconds on every
  # push instead of one nobody waits for.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships Node, and using it keeps an action out of the
      # supply chain for a job that only needs `node` and `npm`. The floor is
      # asserted rather than assumed, so an image that drops below it fails
      # here with a sentence instead of somewhere downstream with a type error.
      - name: Require Node 20 or newer
        run: |
          node --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) { console.error(`Node >= 20 required, got ${process.versions.node}`); process.exit(1); }'
      - run: npm ci
        working-directory: tools/vscode
      - run: npm run lint
        working-directory: tools/vscode
      - run: npm test
        working-directory: tools/vscode
