name: Release

# Two ways in, one code path:
#   * push a `vX.Y.Z` tag, as before; or
#   * run this workflow from the Actions UI/API with the version as input,
#     which needs no local git at all. The tag is then created by the publish
#     step, so a failed build never leaves a dangling tag behind.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.7.1. Must already be the workspace version on the selected branch."
        required: true
        type: string

permissions:
  contents: read

# Two releases at once would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fail before spending three runners on a version that does not agree with
  # the tree, and give every downstream job one tag name to package with.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        shell: bash
        env:
          # Never interpolate an input straight into a shell script.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a X.Y.Z version." >&2
            exit 1
          fi
          tag="v${version}"

          declared="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ "$declared" != "$version" ]; then
            echo "::error::Cargo.toml declares $declared but the release asks for $version. Run scripts/release.sh $version and merge that first." >&2
            exit 1
          fi

          if ! grep -q "^## \[${version}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - <date>' section." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists. Releases are not re-cut; bump the version instead." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${GITHUB_SHA}."

  release-assets:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
      - name: Generate man pages and static completions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          release_date="$(awk -v version="$RELEASE_VERSION" '$0 ~ "^## \\[" version "\\] - " { print $4; exit }' CHANGELOG.md)"
          test -n "$release_date"
          cargo run --locked -p frostbuild-cli --example release-assets \
            --features release-assets -- dist/release-assets "$release_date"
      - name: Render the installed manual
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y man-db
          test "$(find dist/release-assets/share/man/man1 -name '*.1' | wc -l)" -gt 1
          MANPATH="$PWD/dist/release-assets/share/man" man -w frost
          MANPATH="$PWD/dist/release-assets/share/man" MANPAGER=cat man frost >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-assets
          path: dist/release-assets
          if-no-files-found: error

  linux-musl:
    needs: [resolve, release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p frostbuild-cli -p frostbuild-daemon
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-assets
          path: dist/release-assets
      # Packed from explicit metadata (sorted entries, the commit's timestamp,
      # uid/gid 0, no gzip timestamp), so a rebuild of the same tag can
      # reproduce the checksum; see docs/30_distribution.md.
      - name: Package static Linux archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          target/x86_64-unknown-linux-musl/release/frost --version
          python3 scripts/package_release.py --tag "$RELEASE_TAG" \
            --triple x86_64-unknown-linux-musl \
            --binary-dir target/x86_64-unknown-linux-musl/release \
            --assets dist/release-assets --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-musl
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: [resolve, release-assets]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
      - run: cargo build --release --locked -p frostbuild-cli -p frostbuild-daemon
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-assets
          path: dist/release-assets
      - name: Package macOS archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          target/release/frost --version
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --triple "$host" \
            --binary-dir target/release --assets dist/release-assets --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: [resolve, release-assets]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
      - run: cargo build --release --locked -p frostbuild-cli -p frostbuild-daemon
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-assets
          path: dist/release-assets
      - name: Package Windows archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $hostTriple = ((rustc -vV | Select-String '^host:').Line -replace '^host: ', '')
          & target/release/frost.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_release.py --tag "$env:RELEASE_TAG" --triple "$hostTriple" `
            --binary-dir target/release --assets dist/release-assets --output dist --format zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  # Everything a user can check a download against is made here, before the
  # tag exists: SHA256SUMS, a CycloneDX SBOM per archive, a keyless Sigstore
  # signature on every archive and on SHA256SUMS, and GitHub's SLSA build
  # provenance for all of them. No key is stored anywhere — the signing
  # certificate is issued to this workflow's OIDC identity for this run. The
  # job then verifies its own output with scripts/verify_release.sh, the exact
  # procedure README.md publishes, so a release whose signatures would not
  # verify fails here and never gets a tag.
  integrity:
    name: Sign, attest and verify
    needs: [resolve, linux-musl, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-cyclonedx reads the resolved graph through `cargo metadata`.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cosign@3.1.3,cargo-cyclonedx@0.5.9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: (cd dist && sha256sum frostbuild-*.tar.gz frostbuild-*.zip > SHA256SUMS)
      - name: Generate SBOMs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: scripts/release_sbom.sh dist "$RELEASE_VERSION"
      - name: Sign archives and checksums (keyless)
        shell: bash
        run: |
          for blob in dist/SHA256SUMS dist/frostbuild-*.tar.gz dist/frostbuild-*.zip; do
            cosign sign-blob --yes --bundle "${blob}.sigstore.json" "$blob"
          done
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/frostbuild-*.tar.gz
            dist/frostbuild-*.zip
            dist/frostbuild-*.cdx.json
            dist/SHA256SUMS
      - name: Attach the provenance bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: cp "$BUNDLE" "dist/frostbuild-${RELEASE_TAG}.intoto.jsonl"
      - name: Verify with the published procedure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: scripts/verify_release.sh dist "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity
          path: |
            dist/SHA256SUMS
            dist/*.sigstore.json
            dist/*.cdx.json
            dist/*.intoto.jsonl
          if-no-files-found: error

  publish:
    needs: [resolve, release-assets, linux-musl, macos, windows, integrity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Archives, and the checksums, SBOMs, signatures and provenance the
      # integrity job made and verified for exactly those archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check the signed checksums still describe the archives
        shell: bash
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Render package-manager manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
          python3 scripts/render_distribution_manifests.py \
            --version "$RELEASE_VERSION" --checksums dist/SHA256SUMS --output dist
          ruby -c dist/frostbuild.rb
          python3 -m json.tool dist/frostbuild.json >/dev/null
          cp install.sh dist/install.sh
      # On the dispatch path the tag does not exist yet; the action creates it
      # at the commit this run checked out. On the tag-push path it already
      # points there and this is a no-op.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
