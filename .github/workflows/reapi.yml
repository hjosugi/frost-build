name: REAPI

# The external interoperability gate. The in-process tests in `cargo test`
# prove the client against its own server; this job proves the wire types
# against BuildGrid, the OSS executor the certificate in
# `bench/baselines/2026-07-28-buildgrid-reapi-poc.json` was recorded on, with a
# real BuildBox worker for `Execute`.
#
# It is scheduled and manual rather than on every push because it builds
# BuildGrid from source and starts BuildBox, which is minutes of container work
# for a surface that changes rarely. Add a `pull_request` trigger with a `paths`
# filter on `crates/frostbuild-reapi/**` and `scripts/reapi_poc.py` once this is
# green on the runner.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildgrid:
    name: CAS/AC round trip and Execute against BuildGrid 0.8.4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # A BuildGrid image, BuildBox, PostgreSQL and Redis leave little room on a
      # stock runner's ~14 GB disk; the preinstalled SDKs are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      # The certified server, at the commit the certificate names.
      - name: Check out BuildGrid
        run: |
          git clone --filter=blob:none https://gitlab.com/BuildGrid/buildgrid.git "$RUNNER_TEMP/buildgrid"
          git -C "$RUNNER_TEMP/buildgrid" checkout ed56c818e162ee5af82f470b09a9bff35816ec5d

      - name: Start BuildGrid and a BuildBox worker
        working-directory: ${{ runner.temp }}/buildgrid
        run: |
          # Pin the worker to the digest the certificate was recorded with;
          # `:nightly` moves, and a newer BuildBox may not speak to 0.8.4.
          sed -i 's|buildbox:nightly|buildbox:nightly@sha256:14d5c8129023a687d4f0093eb92d3d5ff03b76b84942910b66456549ab5cf295|' docker-compose.yml
          docker compose build
          docker compose up -d --scale controller=1 --scale bots=1
          for attempt in $(seq 1 60); do
            if docker compose exec -T controller grpc_health_probe -addr=:50051; then
              echo "BuildGrid is ready"
              break
            fi
            sleep 5
            if [ "$attempt" = "60" ]; then
              echo "BuildGrid did not become healthy" >&2
              docker compose logs
              exit 1
            fi
          done
          # The worker registers asynchronously, after the controller is healthy.
          sleep 45
          docker compose logs --tail=60 bots

      # The certificate client runs inside the BuildGrid image, which carries the
      # generated REAPI Python modules and grpcio, with this repository mounted.
      # BuildGrid installs into the `/app/env` virtualenv and its entrypoint is
      # `bgd`, so the interpreter is named explicitly: the system `python3` has
      # no `grpc` module, and `bgd python3 …` reads as a `bgd` subcommand.
      - name: Run the Python certificate
        working-directory: ${{ runner.temp }}/buildgrid
        run: |
          docker compose run --rm --no-deps --entrypoint /app/env/bin/python \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            controller scripts/reapi_poc.py \
              --remote http://nginx:50051 \
              --input-root tests/fixtures/reapi \
              --timeout 180 \
              --platform OSFamily=linux \
              --platform ISA=x86-64

      - name: Rust CAS/Action Cache round trip
        env:
          FROST_REAPI_ENDPOINT: grpc://127.0.0.1:50051
        run: cargo test --locked -p frostbuild-reapi --test buildgrid -- --nocapture
